name: FlowTrack CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: flowtrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Shared Package
        run: pnpm --filter @flowtrack/shared test

      - name: Build Shared Package
        run: pnpm --filter @flowtrack/shared build

      - name: Prisma Generate & Migrate
        run: |
          cd apps/api
          npx prisma db push
          npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/flowtrack?schema=public"

      - name: Build API
        run: pnpm --filter @flowtrack/api build

      - name: Build Web Application
        run: pnpm --filter @flowtrack/web build
