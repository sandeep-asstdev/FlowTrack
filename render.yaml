services:
  # NestJS API Service
  - type: web
    name: flowtrack-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @flowtrack/shared build && pnpm --filter @flowtrack/api prisma:generate && pnpm --filter @flowtrack/api build
    preDeployCommand: pnpm --filter @flowtrack/api exec prisma db push --skip-generate --accept-data-loss || true
    startCommand: node apps/api/dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=384"
      - key: DATABASE_URL
        fromDatabase:
          name: flowtrack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: 954853707879-khbiv8su3of67ih08vfflpj2vanqbj2j.apps.googleusercontent.com
      - key: CORS_ORIGIN
        value: https://flowtrack.asstitdev3.workers.dev
      # Redis connection — use full connectionString URL (includes auth automatically)
      - key: REDIS_URL
        fromService:
          type: redis
          name: flowtrack-redis
          property: connectionString
      - key: VAULT_STORAGE_PATH
        value: /tmp/vault_storage
      - key: RELTIGROW_API_URL
        value: https://whatsapp.reltigrow.com/api/v2
      - key: RELTIGROW_OTP_TEMPLATE
        value: loyalty_program_customer_otp
      - key: RELTIGROW_OTP_LANGUAGE
        value: en
      - key: RELTIGROW_API_KEY
        value: wm_IZKmVczIOotucCPNmOyOzi3njqiTnwfadqBSu9gE67z4uGfrsokHzicRI9OU

  # Redis (for BullMQ jobs)
  - type: redis
    name: flowtrack-redis
    region: oregon
    plan: free
    maxmemoryPolicy: noeviction
    # Allow only Render internal services (no public internet access)
    ipAllowList: []

# PostgreSQL Database
databases:
  - name: flowtrack-db
    region: oregon
    plan: free
    databaseName: flowtrack
    user: flowtrack
