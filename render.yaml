services:
  # NestJS API Service
  - type: web
    name: flowtrack-api
    runtime: node
    region: oregon
    plan: free
    rootDir: apps/api
    buildCommand: cd ../.. && pnpm install --frozen-lockfile && pnpm --filter @flowtrack/shared build && pnpm --filter @flowtrack/api prisma:generate && pnpm --filter @flowtrack/api build
    startCommand: node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: flowtrack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: 954853707879-khbiv8su3of67ih08vfflpj2vanqbj2j.apps.googleusercontent.com
      - key: CORS_ORIGIN
        value: https://flowtrack.asstitdev3.workers.dev
      - key: REDIS_HOST
        fromService:
          type: redis
          name: flowtrack-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: flowtrack-redis
          property: port
      - key: REDIS_PASSWORD
        fromService:
          type: redis
          name: flowtrack-redis
          property: password
      - key: VAULT_STORAGE_PATH
        value: /tmp/vault_storage

  # Redis (for BullMQ jobs) — must be under services:, NOT databases:
  - type: redis
    name: flowtrack-redis
    region: oregon
    plan: free
    maxmemoryPolicy: noeviction

# PostgreSQL Database
databases:
  - name: flowtrack-db
    region: oregon
    plan: free
    databaseName: flowtrack
    user: flowtrack

